name: Setup Bun project
description: Instalar Node, Bun y dependencias congeladas; restaurar caché y guardarla sólo desde un productor.

inputs:
  bun-version:
    description: Versión exacta de Bun (pineada para reproducibilidad; el pin se actualiza mediante un lote validado en CI).
    required: false
    default: "1.4.4"
  node-version:
    description: Versión de Node.js a instalar en el runner.
    required: false
    default: "26.13.0"
  save-cache:
    description: Guardar la caché si falta; activar en un único productor (quality).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      # El runtime interno de la action es independiente del Node del proyecto.
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      # Pin a commit SHA por seguridad (action de terceros). Equivale a v2.2.0.
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Verify runtime pins
      shell: bash
      env:
        EXPECTED_NODE: ${{ inputs.node-version }}
        EXPECTED_BUN: ${{ inputs.bun-version }}
      run: |
        node -e 'const fs = require("node:fs"); const assert = require("node:assert/strict"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); const n = process.env.EXPECTED_NODE; const b = process.env.EXPECTED_BUN; assert.equal(process.versions.node, n); assert.equal(p.engines.node, "^22.23.4 || ^24.22.1 || ^26.13.0"); assert.equal(p.engines.bun, b); assert.equal(p.packageManager, `bun@${b}`); for (const f of [".nvmrc", ".node-version"]) assert.equal(fs.readFileSync(f, "utf8").trim(), n); assert.equal(fs.readFileSync(".bun-version", "utf8").trim(), b);'
        test "$(bun --version)" = "$EXPECTED_BUN"
        node --version
        bun --version

    - name: Restore bun dependencies
      id: bun-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-node-${{ inputs.node-version }}-bun-${{ inputs.bun-version }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ inputs.node-version }}-bun-${{ inputs.bun-version }}-

    - name: Install dependencies
      shell: bash
      run: |
        lock_before=$(sha256sum bun.lock)
        bun install --frozen-lockfile
        test "$lock_before" = "$(sha256sum bun.lock)"

    # Guardar inmediatamente después de instalar evita post-steps de caché
    # en cada consumidor. El job quality mantiene la caché caliente.
    - name: Save bun dependencies
      if: inputs.save-cache == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}

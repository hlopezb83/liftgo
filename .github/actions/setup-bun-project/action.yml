name: Setup Bun project
description: Instalar Node, Bun y dependencias congeladas; restaurar caché y guardarla sólo desde un productor.

inputs:
  bun-version:
    description: Versión exacta de Bun (pineada para reproducibilidad; el pin se actualiza mediante un lote validado en CI).
    required: false
    default: "1.4.2"
  node-version:
    description: Versión de Node.js a instalar en el runner.
    required: false
    default: "24"
  save-cache:
    description: Guardar la caché si falta; activar en un único productor (quality).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      # v7.226.1 · setup-node@v5 corre en Node 24 nativo (v4 = Node 20 deprecado sept-2025).
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      # Pin a commit SHA por seguridad (action de terceros). Equivale a v2.2.0.
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Restore bun dependencies
      id: bun-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-node-${{ inputs.node-version }}-bun-${{ inputs.bun-version }}-${{ hashFiles('**/bun.lock', '**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ inputs.node-version }}-bun-${{ inputs.bun-version }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # Guardar inmediatamente después de instalar evita post-steps de caché
    # en cada consumidor. El job quality mantiene la caché caliente.
    - name: Save bun dependencies
      if: inputs.save-cache == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}

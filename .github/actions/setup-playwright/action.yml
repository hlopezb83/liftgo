name: Setup Playwright Chromium
description: Restaurar Chromium de la versión instalada e instalar las librerías del sistema.

inputs:
  save-cache:
    description: Guardar una caché ausente desde el productor quality-build.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolver versión de Playwright
      id: pw-version
      shell: bash
      run: |
        echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

    - name: Restaurar Chromium
      id: browser-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

    # Cache downloaded packages only. The helper verifies signed indexes and
    # hashes before privileged copy; every consumer still runs install-deps.
    - name: Restaurar paquetes descargados de Chromium
      id: apt-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/liftgo-playwright-apt
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-apt-${{ steps.pw-version.outputs.image }}-${{ steps.pw-version.outputs.version }}

    - name: Preparar paquetes descargados para apt
      shell: bash
      run: PLAYWRIGHT_APT_CACHE="$HOME/.cache/liftgo-playwright-apt" python3 scripts/cache-playwright-apt.py restore

    - name: Instalar Chromium y dependencias del sistema
      shell: bash
      env:
        BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [[ "$BROWSER_CACHE_HIT" == "true" ]]; then
          bunx playwright install-deps chromium
        else
          bunx playwright install --with-deps chromium
        fi

    - name: Recoger paquetes descargados de apt
      id: apt-archives
      shell: bash
      run: PLAYWRIGHT_APT_CACHE="$HOME/.cache/liftgo-playwright-apt" python3 scripts/cache-playwright-apt.py save

    - name: Guardar paquetes descargados de Chromium
      if: inputs.save-cache == 'true' && steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-archives.outputs.package-count != '0'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/liftgo-playwright-apt
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}

    - name: Guardar Chromium
      if: inputs.save-cache == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browser-cache.outputs.cache-primary-key }}

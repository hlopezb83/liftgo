name: CI

# CI mínimo y honesto (ver docs/ci.md):
#   - Dos jobs base que siempre corren: `quality` (estático + build + arranque
#     real del bundle) y `tests` (Vitest en 2 shards) + `tests-merge`, que une
#     los blobs y aplica los umbrales de cobertura.
#   - Jobs condicionales que solo corren cuando su área cambió.
#   - CERO secretos de producción: el build de CI apunta a un backend
#     inexistente a propósito. Las pruebas con escritura viven fuera de aquí.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".lovable/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".lovable/**"

  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la corrida obsoleta de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # `dorny/paths-filter` consulta la API de archivos de la PR: con solo el
    # `contents: read` heredado devuelve 403 en pull_request y los jobs
    # condicionales se quedan sin señal.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      migrations: ${{ steps.filter.outputs.migrations }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            functions:
              - 'supabase/functions/**'
              - 'scripts/deno-test-selection.sh'
              - 'scripts/deno-tests-offline.sh'
              - '.github/workflows/ci.yml'
            migrations:
              - 'supabase/migrations/**'
              - 'scripts/lint-migrations.ts'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'


  # ---------------------------------------------------------------------------
  # BASE 1 — ¿compila, cumple las reglas y arranca de verdad?
  # El smoke de navegador sirve el bundle real con `wrangler dev`: es el único
  # punto donde se detectan fallos de empaquetado (p. ej. `__name is not
  # defined`) que el typecheck y los tests unitarios no ven.
  # ---------------------------------------------------------------------------
  quality:
    name: Calidad (lint, tipos, build y arranque)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-project

      - name: ESLint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Guardrails de arquitectura
        run: bash scripts/arch-check.sh

      # Build con destino DELIBERADAMENTE inexistente: el smoke solo verifica
      # arranque y render, nunca datos. Así el CI no necesita secretos.
      - name: Build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-placeholder
          VITE_SUPABASE_PROJECT_ID: ci-smoke
        run: bun run build

      - name: Resolver versión de Playwright
        id: pw-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache de navegadores Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      - name: Instalar Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi

      - name: Smoke de arranque (build real)
        env:
          SMOKE_REUSE_BUILD: "1"
        run: bunx playwright test --config playwright.smoke.config.ts

      - name: Subir diagnóstico del smoke
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # BASE 2 — suite completa de Vitest en DOS shards + un merge mínimo.
  # Cada shard corre su porción con `--coverage` y emite un reporte "blob" en
  # `.vitest-reports/`; `tests-merge` los une y ahí —y solo ahí— se evalúan los
  # umbrales de cobertura globales y por directorio. Nunca `--changed` ni
  # `--passWithNoTests`: todos los PRs pasan por el mismo gate.
  # ---------------------------------------------------------------------------
  tests:
    name: Pruebas (Vitest shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-project

      - name: Vitest (shard ${{ matrix.shard }}/2)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Acotado a este step: activa reporter blob y desactiva umbrales
          # parciales (cada runner ve solo su porción del código).
          VITEST_SHARD_BLOB: "1"
        run: bunx vitest run --shard=${{ matrix.shard }}/2 --coverage

      # `.vitest-reports/` es la ruta real del reporter blob en Vitest 4 y
      # empieza por punto: sin `include-hidden-files` el artifact llega vacío.
      # Se sube también si el shard falló (diagnóstico), pero el job queda rojo.
      - name: Subir blob del shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Une los blobs de los dos shards y evalúa los umbrales sobre la cobertura
  # completa. No reejecuta la suite ni promedia porcentajes. Si falta un
  # artifact, `download-artifact` falla y el workflow queda rojo.
  tests-merge:
    name: Pruebas (merge + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-project

      - name: Descargar blob shard 1
        uses: actions/download-artifact@v8
        with:
          name: vitest-blob-1
          path: .vitest-reports/

      - name: Descargar blob shard 2
        uses: actions/download-artifact@v8
        with:
          name: vitest-blob-2
          path: .vitest-reports/

      - name: Merge de reportes + umbrales de cobertura
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bunx vitest --merge-reports --coverage

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore


  # ---------------------------------------------------------------------------
  # CONDICIONALES
  # ---------------------------------------------------------------------------
  deno-functions:
    name: Funciones Supabase (Deno, sin red)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5 (Node 24)
        with:
          deno-version: v2.x

      - name: Cache de dependencias Deno
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Deno fmt + lint
        run: cd supabase/functions && deno fmt --check && deno lint

      # Solo los tests UNITARIOS/de handler. Los smoke remotos (que hacen HTTP
      # contra funciones desplegadas) NO corren aquí: exigirían apuntar a un
      # backend real, y el de la app es producción. Ver docs/ci.md.
      - name: Tests Deno offline
        run: |
          set -euo pipefail
          cd supabase/functions
          mapfile -t FILES < <(bash ../../scripts/deno-test-selection.sh offline)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "::error::No se encontraron tests Deno offline"
            exit 1
          fi
          echo "Ejecutando ${#FILES[@]} archivos"
          # Descarga de dependencias (necesita red) separada de la ejecución.
          deno cache --node-modules-dir=auto "${FILES[@]}"
          # `--allow-net` acotado al bind local que hace `Deno.serve` al importar
          # un `index.ts`: sin salida a internet, imposible tocar ningún backend.
          deno test --parallel --allow-env --allow-read --allow-net=0.0.0.0:8000 \
            --node-modules-dir=auto --junit-path ../../reports/deno-junit.xml "${FILES[@]}"

      - name: Subir reporte Deno
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deno-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  supabase-lint:
    name: Lint de migraciones
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-project

      # El linter valida el CONTRATO de una migración nueva (CREATE TABLE +
      # GRANT + RLS + POLICY en el mismo archivo). El histórico reparte esas
      # piezas entre archivos, así que solo se linta lo que agrega el diff.
      - name: Resolver migraciones nuevas/modificadas
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            FILES=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF"...HEAD -- 'supabase/migrations/*.sql' | tr '\n' ' ')
          elif [[ "$EVENT" == "push" ]]; then
            FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'supabase/migrations/*.sql' 2>/dev/null | tr '\n' ' ' || true)
          else
            FILES=""
          fi
          echo "list=${FILES}" >> "$GITHUB_OUTPUT"
          echo "Archivos: ${FILES:-<ninguno>}"

      - name: Validar GRANT / RLS / POLICY / search_path
        if: steps.files.outputs.list != ''
        run: bun scripts/lint-migrations.ts ${{ steps.files.outputs.list }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 (Node 24)
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, Python-2.0, MPL-2.0, CC-BY-4.0, BlueOak-1.0.0

  # Corre en push y en PR cuando cambia algo bajo `.github/`: un workflow roto
  # entra igual de fácil por push directo. `reporter: local` + `filter_mode:
  # nofilter` porque publicar un check exige `checks: write` (permiso que este
  # workflow no tiene) y porque limitar a las líneas añadidas oculta errores
  # que el propio cambio provoca en el resto del archivo.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: local


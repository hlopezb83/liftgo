name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Calidad
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Secretos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: ESLint
        run: |
          bun run lint --max-warnings=0
          node node_modules/eslint/bin/eslint.js --config eslint.group-c-design.config.mjs --max-warnings=0 tests/design-group-c tests/offlineTeardown.ts tests/offlineTeardown.test.mjs playwright.group-c-design.config.ts playwright.group-c-component.config.ts vite.group-c-fixture.config.ts
      - name: Revisión de dependencias
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, Python-2.0, MPL-2.0, CC-BY-4.0, BlueOak-1.0.0
      - name: TypeScript
        run: |
          bun run typecheck
          bun run typecheck:browser-tests
      - name: Arquitectura y dependencias
        run: |
          bash scripts/arch-check.sh
          bun run test:dependencies
      - name: Contratos de calidad
        run: |
          node --test scripts/tests/release-identity.test.mjs scripts/tests/eslint-guardrails.test.mjs scripts/tests/feature-imports.test.mjs scripts/tests/browser-typecheck.test.mjs scripts/tests/lint-migrations.test.mjs scripts/tests/quality-workflow.test.mjs
          node --test tests/offlineTeardown.test.mjs tests/design-group-c/artifactGuard.test.mjs
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          node --test scripts/tests/deno-ci-import-map.test.mjs
      - name: Validar workflows
        uses: reviewdog/action-actionlint@7abf25e1607ec65838b73d0484ff31f8e9499d80 # v1.81.2
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: local
      - name: Áreas modificadas
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            functions:
              - supabase/functions/**
              - scripts/deno-test-selection.sh
              - scripts/deno-tests-offline.sh
              - scripts/ci/deno-import-map.mjs
              - scripts/ci/vendor/**
              - .github/workflows/ci.yml
            migrations:
              - supabase/migrations/**/*.sql
              - drizzle/migrations/**/*.sql
            sql_contracts:
              - drizzle/migrations/meta/_journal.json
              - scripts/tests/invoice-booking-reads.*
              - scripts/tests/dashboard-search.*
              - scripts/tests/quotes/atomic-conversion.*
              - scripts/tests/recurring-future-coverage.test.cjs
              - supabase/functions/generate-recurring-invoices/**
              - scripts/ci/setup-postgres-17.sh
            quote_paging:
              - scripts/tests/quotes/**
              - drizzle/migrations/**/*quote*.sql
              - drizzle/migrations/0031_multi_org_audit_hardening.sql
              - src/features/quotes/hooks/quotes/useQuotesPage.ts
              - src/features/quotes/lib/quotesPageRpc.ts
              - src/features/quotes/pages/QuotesPage.tsx
              - src/features/quotes/pages/quotesColumns.tsx
              - scripts/ci/setup-postgres-17.sh
              - .github/workflows/ci.yml
      - name: Lint de migraciones modificadas
        if: steps.changes.outputs.migrations == 'true'
        env:
          MIGRATION_FILES: ${{ steps.changes.outputs.migrations_files }}
        run: node --input-type=module -e 'import fs from "node:fs"; import {spawnSync} from "node:child_process"; const files=JSON.parse(process.env.MIGRATION_FILES).filter(f=>fs.existsSync(f)); if(files.length){const r=spawnSync("bun",["scripts/lint-migrations.ts",...files],{stdio:"inherit"}); if(r.error)throw r.error; process.exit(r.status??1)}'
      - name: Preparar PostgreSQL 17
        id: postgres17
        if: steps.changes.outputs.migrations == 'true' || steps.changes.outputs.sql_contracts == 'true' || steps.changes.outputs.quote_paging == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 2
        run: bash scripts/ci/setup-postgres-17.sh
      - name: Contratos de lectura y conversión en PostgreSQL efímero
        if: steps.changes.outputs.migrations == 'true' || steps.changes.outputs.sql_contracts == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PG_BIN: ${{ steps.postgres17.outputs.bin }}
          LD_LIBRARY_PATH: ${{ steps.postgres17.outputs.lib }}
          RUN_LOCAL_RECURRING_TESTS: '1'
        run: |
          bun run migrations:check
          node scripts/tests/invoice-booking-reads.postgres.mjs
          node scripts/tests/dashboard-search.postgres.mjs
          node scripts/tests/recurring-future-coverage.test.cjs
      - name: Contratos de búsqueda y paginación de cotizaciones
        if: steps.changes.outputs.quote_paging == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PG_BIN: ${{ steps.postgres17.outputs.bin }}
          LD_LIBRARY_PATH: ${{ steps.postgres17.outputs.lib }}
          RUN_LOCAL_QUOTES_TESTS: '1'
        run: node scripts/tests/quotes/run-local-postgres.mjs
      - name: Deno
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - name: Funciones offline
        if: steps.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd supabase/functions
          deno fmt --check
          deno lint
          cd ../..
          bash scripts/deno-tests-offline.sh
  tests:
    name: Unitarias ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Vitest completo sin cobertura
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/vitest/vitest.mjs run --shard="$SHARD/$SHARDS"
      - name: Diagnóstico de fallo
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unitarias-${{ matrix.shard }}
          path: reports/
          retention-days: 3
          if-no-files-found: ignore
  build-smoke:
    name: Build y smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SMOKE_REUSE_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Build real con backend ficticio
        run: node scripts/browser-test-server.mjs --build-only
      - name: Caché de Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-v2-${{ hashFiles('bun.lock') }}
      - name: Preparar Chromium
        # ubuntu-24.04 already supplies the browser's system libraries.
        run: node node_modules/@playwright/test/cli.js install chromium
      - name: Contrato de aislamiento de navegador y Worker
        run: node --test scripts/tests/browser-test-*.test.mjs
      - name: Arranque e interacción del Worker
        run: node node_modules/@playwright/test/cli.js test --config playwright.smoke.config.ts
      - name: Diagnóstico de fallo
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-diagnostico
          path: |-
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

name: Gitleaks

# Detección de secretos. Sin cron: un secreto solo entra al repo por un push o
# un PR, y ambos ya están cubiertos. La corrida semanal repetía el mismo
# escaneo sobre commits ya revisados.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Permiso mínimo: el reporte va al resumen del job, así que no hace falta
# escribir comentarios en la PR.
permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Detectar secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Historia completa: también detecta secretos en commits anteriores.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (Node 24)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true
          # El README de esta revisión pineada documenta TRUE como valor por
          # defecto: sin fijarlo, la acción intenta comentar en la PR y
          # necesitaría pull-requests:write. El reporte vive en el resumen.
          GITLEAKS_ENABLE_COMMENTS: "false"


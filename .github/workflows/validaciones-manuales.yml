name: Validaciones manuales
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite aislada a ejecutar
        type: choice
        required: true
        default: browser
        options:
          - browser
          - coverage
          - rls
          - multiempresa
          - codeql
          - all
permissions:
  contents: read
concurrency:
  group: manual-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false
jobs:
  browser-a:
    name: Aceptación offline A (grupos aislados)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SMOKE_REUSE_BUILD: "1"
      GROUP_C_BUILD_DIR: .
      GROUP_C_EVIDENCE_DIR: test-results/group-c
      BOOKINGS_EVIDENCE_DIR: test-results/bookings/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Excluir archivos de entorno locales
        run: rm -f -- .env .env.*
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Compilar build ficticio independiente
        run: node scripts/browser-test-server.mjs --build-only
      - name: Caché de Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-v2-${{ hashFiles('bun.lock') }}
      - name: Preparar Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verificar aislamiento de navegador y Worker con destinos locales
        run: node --test scripts/tests/browser-test-*.test.mjs
      - name: Smoke de arranque (build real)
        run: bunx playwright test --config playwright.smoke.config.ts
      - name: Ejecutar todas las suites en grupos internos aislados
        run: python3 scripts/run-browser-acceptance.py --lane a
      - name: Subir evidencia del carril
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'browser' || inputs.suite == 'all')
  browser-b:
    name: Aceptación offline B (grupos aislados)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SMOKE_REUSE_BUILD: "1"
      GROUP_C_BUILD_DIR: .
      GROUP_C_EVIDENCE_DIR: test-results/group-c
      BOOKINGS_EVIDENCE_DIR: test-results/bookings/evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Excluir archivos de entorno locales
        run: rm -f -- .env .env.*
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Compilar build ficticio independiente
        run: node scripts/browser-test-server.mjs --build-only
      - name: Caché de Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-v2-${{ hashFiles('bun.lock') }}
      - name: Preparar Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verificar aislamiento de navegador y Worker con destinos locales
        run: node --test scripts/tests/browser-test-*.test.mjs
      - name: Ejecutar todas las suites en grupos internos aislados
        run: python3 scripts/run-browser-acceptance.py --lane b
      - name: Subir evidencia del carril
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'browser' || inputs.suite == 'all')
  coverage:
    name: Pruebas (Vitest shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Aislar salida del shard
        run: |
          shard_dir=$(mktemp -d "$RUNNER_TEMP/vitest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-shard-${{ matrix.shard }}-XXXXXX")
          echo "VITEST_SHARD_DIR=$shard_dir" >> "$GITHUB_ENV"
          echo "VITEST_BLOB_OUTPUT_FILE=$shard_dir/blob.json" >> "$GITHUB_ENV"
      - name: Vitest (shard ${{ matrix.shard }}/6)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITEST_SHARD_BLOB: "1"
        run: node node_modules/vitest/vitest.mjs run --shard=${{ matrix.shard }}/6 --coverage
      - name: Sellar procedencia del shard
        if: always()
        run: node scripts/vitest-blob-provenance.mjs seal "$VITEST_SHARD_DIR" "${{ matrix.shard }}"
      - name: Subir blob del shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-blob-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ env.VITEST_SHARD_DIR }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'coverage' || inputs.suite == 'all')
  coverage-merge:
    name: Pruebas (merge + cobertura)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Contrato de procedencia
        run: node --test scripts/tests/vitest-blob-provenance.test.mjs
      - name: Aislar descarga y entradas de merge
        run: |
          merge_root=$(mktemp -d "$RUNNER_TEMP/vitest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-merge-XXXXXX")
          mkdir "$merge_root/downloads" "$merge_root/verified"
          echo "VITEST_DOWNLOAD_DIR=$merge_root/downloads" >> "$GITHUB_ENV"
          echo "VITEST_MERGE_DIR=$merge_root/verified" >> "$GITHUB_ENV"
      - name: Descargar blob shard 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-blob-${{ github.run_id }}-${{ github.run_attempt }}-1
          path: ${{ env.VITEST_DOWNLOAD_DIR }}/shard-1
      - name: Descargar blob shard 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-blob-${{ github.run_id }}-${{ github.run_attempt }}-2
          path: ${{ env.VITEST_DOWNLOAD_DIR }}/shard-2
      - name: Descargar blob shard 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-blob-${{ github.run_id }}-${{ github.run_attempt }}-3
          path: ${{ env.VITEST_DOWNLOAD_DIR }}/shard-3
      - name: Descargar blob shard 4
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-blob-${{ github.run_id }}-${{ github.run_attempt }}-4
          path: ${{ env.VITEST_DOWNLOAD_DIR }}/shard-4
      - name: Descargar blob shard 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-blob-${{ github.run_id }}-${{ github.run_attempt }}-5
          path: ${{ env.VITEST_DOWNLOAD_DIR }}/shard-5
      - name: Descargar blob shard 6
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vitest-blob-${{ github.run_id }}-${{ github.run_attempt }}-6
          path: ${{ env.VITEST_DOWNLOAD_DIR }}/shard-6
      - name: Verificar seis shards y su procedencia
        run: node scripts/vitest-blob-provenance.mjs merge "$VITEST_DOWNLOAD_DIR" "$VITEST_MERGE_DIR"
      - name: Merge de reportes + umbrales de cobertura
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node node_modules/vitest/vitest.mjs --merge-reports="$VITEST_MERGE_DIR" --coverage
      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
  rls:
    name: RLS DB tests (Supabase local)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'rls' || inputs.suite == 'all')
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Probar ejecutor SQL y guard de base antes de arrancar la BD
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_run_sql_suites.py
          python3 -m unittest discover -s scripts/tests -p test_ci_database.py
          python3 -m unittest discover -s scripts/tests -p test_control0123_receipt.py
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.34.0
      - name: Verificar historial canonico antes de parches locales
        run: python3 scripts/ci_database.py preflight
      - name: Parchar migraciones fuera de orden (solo en el runner)
        run: python3 scripts/patch_legacy_migrations.py
      - name: Exigir base vacía y deshabilitar seed local
        run: python3 scripts/ci_database.py prepare
      - name: Start Supabase (DB + auth, sin gateway ni PostgREST)
        continue-on-error: false
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          trap 'cron_bootstrap_status=$?; trap - EXIT; python3 scripts/ci_database.py restore-config || cron_bootstrap_status=1; exit "$cron_bootstrap_status"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker version
          supabase --version
          START_TS=$(date +%s)
          python3 scripts/ci_database.py start-guarded --profile rls
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "Start Supabase: ${ELAPSED}s (referencia run 35543605857: ~200s)"
          echo "### Start Supabase: ${ELAPSED}s (referencia previa ~200s)" >> "$GITHUB_STEP_SUMMARY"
          # `status` imprime URLs de servicios; con kong/postgrest excluidos puede
          # devolver salida parcial y no debe tumbar el job.
          supabase status || echo "supabase status parcial (servicios excluidos)"
      - name: Verificar schema auth disponible
        run: |
          set -euo pipefail
          HAS_USERS=$(psql "$DB_URL" -Atc "select to_regclass('auth.users') is not null")
          HAS_UID=$(psql "$DB_URL" -Atc "select exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'auth' and p.proname = 'uid')")
          echo "auth.users: $HAS_USERS / auth.uid(): $HAS_UID"
          if [[ "$HAS_USERS" != "t" || "$HAS_UID" != "t" ]]; then
            echo "::error::El schema auth no está completo (auth.users=$HAS_USERS, auth.uid()=$HAS_UID)"
            exit 1
          fi
      - name: Diagnóstico de arranque (solo en fallo)
        if: failure()
        run: |
          set +e
          echo "::group::docker ps -a"
          docker ps -a
          echo "::endgroup::"
          echo "::group::supabase status"
          supabase status
          echo "::endgroup::"
          for c in $(docker ps -aq --filter "name=supabase_"); do
            echo "::group::logs $(docker inspect --format '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done
      - name: Verificar migraciones aplicadas
        id: database-verified
        run: python3 scripts/ci_database.py verify
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Validar journal de migraciones Drizzle
        run: bun run migrations:check
      - name: Probar guard y preparar replay Drizzle efímero
        run: |
          bun run test:ci-tools
          bun scripts/ci-drizzle-replay.mjs prepare
          mkdir -p reports
          cp .ci-drizzle-replay/manifest.json reports/ci-drizzle-replay-manifest.json
      - name: Aplicar y verificar migraciones Drizzle del replay efímero
        id: drizzle
        run: |
          set -euo pipefail
          bunx drizzle-kit migrate --config=drizzle.ci.config.ts
          bun scripts/ci-drizzle-replay.mjs verify
          python3 scripts/ci_database.py check-cron-off
      - name: Verify exact control0123 receipt on full replayed schema
        if: success() && steps.drizzle.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 scripts/tests/run_control0123_receipt.py 2>&1 | tee reports/control0123-receipt.log
          test "$(grep -Fxc 'PASS control0123-receipt COMPLETE ledger=unchanged acl=unchanged functions=6' reports/control0123-receipt.log)" -eq 1 || {
            echo "::error::The exact receipt, ledger and six inherited ACL snapshots did not complete"
            exit 1
          }
      - name: Diagnóstico PostgreSQL de Drizzle (sólo rollback en fallo)
        if: failure() && steps.drizzle.outcome == 'failure'
        run: bun scripts/ci-drizzle-diagnostics.mjs
      - name: Exportar definiciones efectivas de Estado de Resultados
        if: success() && steps.drizzle.outcome == 'success'
        run: node scripts/ci-drizzle-function-report.mjs
      - name: Prepare reports directory
        run: mkdir -p reports
      - name: Recurring invoice locking regression (18 isolated scenarios)
        env:
          RUN_LOCAL_RECURRING_TESTS: "1"
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          for binary in initdb pg_ctl postgres; do
            test -x "$PG_BIN/$binary" || { echo "::error::Missing trusted PostgreSQL binary: $binary"; exit 1; }
          done
          "$PG_BIN/postgres" --version
          node scripts/tests/recurring-invoice-locking.test.cjs 2>&1 | tee reports/recurring-invoice-locking.log
          test "$(grep -c '^PASS ' reports/recurring-invoice-locking.log)" -eq 18 || {
            echo "::error::Expected all 18 recurring invoice locking scenarios; skip or partial runs are not accepted"
            exit 1
          }
      - name: Historical quote charge reconciliation (RLS and 9 real races)
        timeout-minutes: 5
        env:
          RUN_LOCAL_QUOTE_CHARGE_TESTS: "1"
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          for binary in initdb pg_ctl postgres; do
            test -x "$PG_BIN/$binary" || { echo "::error::Missing trusted PostgreSQL binary: $binary"; exit 1; }
          done
          "$PG_BIN/postgres" --version
          node scripts/tests/quote-charge-legacy-reconciliation.test.cjs 2>&1 | tee reports/quote-charge-legacy-reconciliation.log
          test "$(grep -c '^PASS quote-charge-race ' reports/quote-charge-legacy-reconciliation.log)" -eq 9 || {
            echo "::error::Expected all 9 quote charge races; skipped or partial runs are not accepted"
            exit 1
          }
          grep -Fxq 'PASS quote-charge-rls ACTIVE' reports/quote-charge-legacy-reconciliation.log || {
            echo "::error::Real role RLS was not verified"
            exit 1
          }
          grep -Fxq 'PASS quote-charge-suite COMPLETE races=9 rls=1' reports/quote-charge-legacy-reconciliation.log || {
            echo "::error::Quote charge reconciliation suite did not complete"
            exit 1
          }
      - name: REP recovery persistence (real isolated PostgreSQL, synthetic PAC)
        env:
          RUN_LOCAL_FISCAL_TESTS: "1"
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --noEmit -p scripts/tests/fiscal/tsconfig.json
          node scripts/tests/fiscal/run-rep-postgres.mjs 2>&1 | tee reports/rep-postgres-integration.log
      - name: Statement documents and inherited ACL regression (isolated PostgreSQL)
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          node scripts/tests/reports/income-statement-documents.cjs 2>&1 | tee reports/statement-documents.log
      - name: Statement calculation and detail regression (isolated PostgreSQL)
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          node scripts/tests/reports/income-statement-calculations.cjs 2>&1 | tee reports/statement-calculations.log
      - name: Non-recurring invoice overlap regression (isolated PostgreSQL)
        env:
          RUN_LOCAL_OVERLAP_TESTS: "1"
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 scripts/tests/test_nonrecurring_invoice_overlap.py 2>&1 | tee reports/nonrecurring-invoice-overlap.log
      - name: Protección del último raíz con dos sesiones concurrentes
        run: python3 scripts/platform_root_concurrency.py
      - name: Global permission audit and atomic release (isolated PostgreSQL)
        env:
          RUN_LOCAL_SUMMARY_TESTS: "1"
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_prepare_dispatcher_audit_release.py -v
          python3 scripts/tests/test_global_role_permission_audit.py -v 2>&1 | tee reports/global-permission-audit.log
          python3 scripts/tests/test_historical_ledger_contract.py -v 2>&1 | tee reports/historical-ledger-contract.log
      - name: RLS suites (supabase/tests/rls/*.sql)
        id: rls
        run: |
          python3 scripts/run_sql_suites.py \
            --db-url "$DB_URL" \
            --dir supabase/tests/rls \
            --junit reports/rls-db-junit.xml \
            --suite-name "RLS DB" \
            --mode strict
      - name: Smoke SQL (supabase/tests/*.sql)
        id: smoke
        if: always() && steps.database-verified.outcome == 'success' && steps.drizzle.outcome == 'success'
        run: |
          python3 scripts/run_sql_suites.py \
            --db-url "$DB_URL" \
            --dir supabase/tests \
            --junit reports/sql-smoke-junit.xml \
            --suite-name "SQL smoke" \
            --mode smoke
      - name: Recurring invoice concurrency on full replayed schema (5 scenarios)
        run: |
          set -euo pipefail
          node scripts/tests/fiscal/recurring-full-schema.mjs 2>&1 | tee reports/recurring-full-schema.log
          test "$(grep -c '^PASS full-schema ' reports/recurring-full-schema.log)" -eq 5
      - name: Invoice source concurrency on full replayed schema (8 scenarios)
        run: |
          set -euo pipefail
          node scripts/tests/fiscal/invoice-source-full-schema.mjs 2>&1 | tee reports/invoice-source-full-schema.log
          test "$(grep -c '^PASS full-schema source ' reports/invoice-source-full-schema.log)" -eq 8
      - name: Upload SQL reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rls-db-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: |
          set +e
          python3 scripts/ci_database.py restore-config
          RESTORE_CONFIG_STATUS=$?
          supabase stop --no-backup || true
          exit "$RESTORE_CONFIG_STATUS"
  inventory:
    name: Inventory tenant and paging contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Prepare disposable PostgreSQL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Verify synthetic inventory isolation and pagination
        env:
          RUN_LOCAL_INVENTORY_TESTS: "1"
          PG_BIN: /usr/lib/postgresql/16/bin
        run: node scripts/tests/inventory/run-local-postgres.mjs
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'rls' || inputs.suite == 'all')
  multiempresa:
    name: Gate A/B multiempresa (Supabase local efímero)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'multiempresa' || inputs.suite == 'all')
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      E2E_ISOLATED_BACKEND: "1"
      VITE_SUPABASE_PROJECT_ID: local-ab-ephemeral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Probar guard de base antes de arrancar la BD
        run: python3 -m unittest discover -s scripts/tests -p test_ci_database.py
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.34.0
      - name: Excluir entorno local
        run: rm -f -- .env .env.* .dev.vars .dev.vars.*
      - name: Node del proyecto
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Bun del proyecto
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Caché de paquetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json', '.bun-version', '.node-version') }}
      - name: Instalación congelada
        run: |
          node scripts/verify-ci-runtime.mjs
          lock_before=$(sha256sum bun.lock)
          bun install --frozen-lockfile
          test "$lock_before" = "$(sha256sum bun.lock)"
      - name: Verificar historial canonico antes de parches locales
        run: python3 scripts/ci_database.py preflight
      - name: Parchar migraciones fuera de orden (solo en el runner)
        run: python3 scripts/patch_legacy_migrations.py
      - name: Exigir base vacía y deshabilitar seed local
        run: python3 scripts/ci_database.py prepare
      - name: Start Supabase (DB + auth + API + Storage)
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          trap 'cron_bootstrap_status=$?; trap - EXIT; python3 scripts/ci_database.py restore-config || cron_bootstrap_status=1; exit "$cron_bootstrap_status"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 scripts/ci_database.py start-guarded --profile ab
          supabase status
      - name: Verificar schema auth disponible
        run: |
          set -euo pipefail
          HAS_USERS=$(psql "$DB_URL" -Atc "select to_regclass('auth.users') is not null")
          HAS_UID=$(psql "$DB_URL" -Atc "select exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'auth' and p.proname = 'uid')")
          if [[ "$HAS_USERS" != "t" || "$HAS_UID" != "t" ]]; then
            echo "::error::El schema auth no está completo (auth.users=$HAS_USERS, auth.uid()=$HAS_UID)"
            exit 1
          fi
      - name: Verificar migraciones aplicadas
        run: python3 scripts/ci_database.py verify
      - name: Validar journal de migraciones Drizzle
        run: bun run migrations:check
      - name: Probar guard y preparar replay Drizzle efímero
        run: |
          bun run test:ci-tools
          bun scripts/ci-drizzle-replay.mjs prepare
          mkdir -p reports
          cp .ci-drizzle-replay/manifest.json reports/ci-drizzle-replay-manifest.json
      - name: Aplicar y verificar migraciones Drizzle del replay efímero
        id: drizzle
        run: |
          set -euo pipefail
          bunx drizzle-kit migrate --config=drizzle.ci.config.ts
          bun scripts/ci-drizzle-replay.mjs verify
          python3 scripts/ci_database.py check-cron-off
      - name: Diagnóstico PostgreSQL de Drizzle (sólo rollback en fallo)
        if: failure() && steps.drizzle.outcome == 'failure'
        run: bun scripts/ci-drizzle-diagnostics.mjs
      - name: Exportar credenciales locales efímeras
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase-local.env
          # shellcheck disable=SC1091
          set -a; source /tmp/supabase-local.env; set +a
          # Fail-closed: si la CLI local no entregó credenciales, aborta antes
          # de escribir nada en GITHUB_ENV.
          if [[ -z "$API_URL" || -z "$ANON_KEY" || -z "$SERVICE_ROLE_KEY" ]]; then
            echo "::error::Credenciales locales incompletas (API_URL/ANON_KEY/SERVICE_ROLE_KEY vacíos)"
            rm -f /tmp/supabase-local.env
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          # El middleware server-side (auth-middleware.ts) exige SUPABASE_URL y
          # SUPABASE_PUBLISHABLE_KEY ademas de las variantes VITE_*. Sin
          # SUPABASE_PUBLISHABLE_KEY, requireSupabaseAuth falla y el portal nunca
          # monta el layout autenticado.
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          rm -f /tmp/supabase-local.env
          case "$API_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::La API local no es loopback"; exit 1 ;;
          esac
      - name: Crear .dev.vars efímero para Wrangler
        run: |
          set -euo pipefail
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_PROJECT_ID=local-ab-ephemeral"
          } > .dev.vars
          chmod 600 .dev.vars
      - name: Verificar .dev.vars apunta al Supabase local
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_ID; do
            grep -q "^${key}=." .dev.vars || { echo "::error::Falta $key en .dev.vars"; exit 1; }
          done
          url="$(grep '^SUPABASE_URL=' .dev.vars | cut -d= -f2-)"
          case "$url" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::SUPABASE_URL de .dev.vars no es loopback"; exit 1 ;;
          esac
          if grep -q "zxefrzfaynnfwazqhwxp" .dev.vars; then
            echo "::error::.dev.vars contiene el ref productivo"; exit 1
          fi
          echo ".dev.vars OK: 4 bindings presentes, URL loopback, sin ref productivo"
      - name: Caché de Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-v2-${{ hashFiles('bun.lock') }}
      - name: Preparar Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Historical quote charge review browser (6 cases)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js test --config playwright.quote-charge-review.config.ts 2>&1 | tee reports/quote-charge-review-browser.log
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("reports/quote-charge-review-browser.json","utf8"));const s=r.stats;if(r.errors?.length||!s||s.expected!==6||s.skipped!==0||s.unexpected!==0||s.flaky!==0)throw new Error("Expected all six quote charge browser cases, without skips or failures");console.log("PASS quote-charge-browser COMPLETE tests=6 skipped=0");'
      - name: Ejecutar gate A/B (datos + Storage + portal)
        env:
          SUPABASE_PROJECT_ID: local-ab-ephemeral
        run: bun run test:multitenant-ab
      - name: Subir evidencia (sin credenciales)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: multitenant-ab-evidence
          path: |
            reports/ci-drizzle-replay-manifest.json
            reports/multitenant-ab-junit.xml
            reports/multitenant-ab.json
            reports/multitenant-ab-matrix.json
            reports/multitenant-ab-matrix.md
            reports/quote-charge-review-browser.json
            reports/quote-charge-review-browser.log
            test-results/quote-charge-review/
            playwright-report-multitenant/
          if-no-files-found: warn
          retention-days: 7
      - name: Destruir entorno efímero
        if: always()
        run: |
          rm -f .dev.vars
          set +e
          python3 scripts/ci_database.py restore-config
          RESTORE_CONFIG_STATUS=$?
          supabase stop --no-backup || true
          exit "$RESTORE_CONFIG_STATUS"
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:javascript-typescript
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'codeql' || inputs.suite == 'all')
  analyze-tooling:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'codeql' || inputs.suite == 'all')

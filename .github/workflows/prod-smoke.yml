name: Prod smoke

# Único monitoreo automático: dos peticiones de LECTURA a la app publicada.
# No escribe nada, no autentica y no toca la base. Detecta caídas y rollbacks
# silenciosos entre releases.

on:
  schedule:
    # Cada hora, en el minuto 17: el minuto 0 es el más congestionado en
    # GitHub Actions y la corrida se retrasaba o se saltaba.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-smoke
  cancel-in-progress: true

env:
  APP_URL: https://liftgo.lovable.app

jobs:
  ping:
    name: Ping app y version.json
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: HEAD /
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 5 --fail-with-body --silent --show-error \
            --max-time 15 -I "$APP_URL/" | head -1

      - name: GET /version.json
        run: |
          set -euo pipefail
          BODY=$(curl --retry 3 --retry-delay 5 --fail-with-body --silent --show-error \
            --max-time 15 "$APP_URL/version.json")
          echo "$BODY"
          # Validación real: JSON parseable con una versión semver no vacía.
          VERSION=$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version.json no expone una versión semver válida (recibido: '${VERSION}')"
            exit 1
          fi
          echo "Versión publicada: $VERSION"

      - name: Abrir o actualizar issue en fallo
        if: failure()
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0 (Node 24)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "Prod smoke fallando";
            const body = `El smoke de producción falló.\n\nRun: ${process.env.RUN_URL}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "prod-smoke",
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["prod-smoke", "incident"],
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issues[0].number, body,
              });
            }

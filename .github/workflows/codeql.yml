name: CodeQL

# Análisis profundo de seguridad. Solo semanal y manual: en cada push tardaba
# ~15 min y encontraba lo mismo que la corrida semanal. Los errores que sí
# deben bloquear un PR ya los cubren ESLint, typecheck y dependency-review.

on:
  schedule:
    # Lunes 12:00 UTC (06:00 America/Monterrey)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

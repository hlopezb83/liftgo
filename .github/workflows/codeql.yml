name: CodeQL

# Análisis profundo de seguridad (análisis semántico de flujo de datos). Solo
# semanal y manual para mantenerlo fuera del camino crítico del PR: no es
# sustituible por ESLint ni por dependency-review, que cubren otras clases de
# problema. Un hallazgo aquí se atiende igual, solo que no bloquea el merge.


on:
  schedule:
    # Lunes 12:00 UTC (06:00 America/Monterrey)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

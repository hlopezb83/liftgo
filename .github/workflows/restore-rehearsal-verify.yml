name: Restore rehearsal · verificación posterior a restore

# No restaura datos. Verifica en READ ONLY una copia restaurada externamente.
on:
  workflow_dispatch:
    inputs:
      expected_ref:
        description: "Ref/host esperado de la instancia aislada"
        required: true
        type: string
      backup_timestamp_utc:
        description: "Timestamp UTC del backup (ISO-8601)"
        required: true
        type: string
      incident_timestamp_utc:
        description: "Timestamp UTC del incidente simulado (ISO-8601)"
        required: true
        type: string
      restore_started_utc:
        description: "Inicio del restore en UTC (ISO-8601)"
        required: true
        type: string
      restore_ready_utc:
        description: "Copia lista en UTC (ISO-8601)"
        required: true
        type: string
      rpo_target_minutes:
        description: "Objetivo RPO en minutos"
        required: true
        type: string
      rto_target_minutes:
        description: "Objetivo RTO en minutos"
        required: true
        type: string
      confirm:
        description: "Escribe exactamente VERIFY-ISOLATED-RESTORE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: restore-rehearsal-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar copia restaurada (sólo lectura)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: restore-rehearsal
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun project
        uses: ./.github/actions/setup-bun-project

      - name: Validar inputs (fail-closed)
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_REF: ${{ inputs.expected_ref }}
          BACKUP_TS: ${{ inputs.backup_timestamp_utc }}
          INCIDENT_TS: ${{ inputs.incident_timestamp_utc }}
          STARTED_TS: ${{ inputs.restore_started_utc }}
          READY_TS: ${{ inputs.restore_ready_utc }}
          RPO: ${{ inputs.rpo_target_minutes }}
          RTO: ${{ inputs.rto_target_minutes }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "VERIFY-ISOLATED-RESTORE" ]] || { echo "::error::Confirmación inválida"; exit 1; }
          for name in EXPECTED_REF BACKUP_TS INCIDENT_TS STARTED_TS READY_TS RPO RTO; do
            [[ -n "${!name}" ]] || { echo "::error::Input vacío: $name"; exit 1; }
          done
          [[ "$EXPECTED_REF" != *"zxefrzfaynnfwazqhwxp"* ]] || { echo "::error::Ref productivo bloqueado"; exit 1; }
          iso='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?(\.[0-9]+)?Z$'
          for ts in "$BACKUP_TS" "$INCIDENT_TS" "$STARTED_TS" "$READY_TS"; do
            [[ "$ts" =~ $iso ]] || { echo "::error::Timestamp UTC inválido"; exit 1; }
          done
          for n in "$RPO" "$RTO"; do
            [[ "$n" =~ ^[0-9]+$ && "$n" -gt 0 ]] || { echo "::error::Objetivo inválido"; exit 1; }
          done

      - name: Verificar destino aislado sin imprimir el secret
        env:
          RESTORE_REHEARSAL_DATABASE_URL: ${{ secrets.RESTORE_REHEARSAL_DATABASE_URL }}
        run: |
          set -euo pipefail
          [[ -n "${RESTORE_REHEARSAL_DATABASE_URL:-}" ]] || { echo "::error::Falta RESTORE_REHEARSAL_DATABASE_URL"; exit 1; }
          [[ "$RESTORE_REHEARSAL_DATABASE_URL" != *"zxefrzfaynnfwazqhwxp"* ]] || { echo "::error::Destino productivo bloqueado"; exit 1; }
          echo "Destino aislado: secret presente y sin ref productivo"

      - name: Verificar copia restaurada (READ ONLY)
        env:
          RESTORE_REHEARSAL_DATABASE_URL: ${{ secrets.RESTORE_REHEARSAL_DATABASE_URL }}
          RESTORE_REHEARSAL_EXPECTED_REF: ${{ inputs.expected_ref }}
          RESTORE_REHEARSAL_BACKUP_TIMESTAMP_UTC: ${{ inputs.backup_timestamp_utc }}
          RESTORE_REHEARSAL_INCIDENT_TIMESTAMP_UTC: ${{ inputs.incident_timestamp_utc }}
          RESTORE_REHEARSAL_STARTED_UTC: ${{ inputs.restore_started_utc }}
          RESTORE_REHEARSAL_READY_UTC: ${{ inputs.restore_ready_utc }}
          RESTORE_REHEARSAL_RPO_TARGET_MINUTES: ${{ inputs.rpo_target_minutes }}
          RESTORE_REHEARSAL_RTO_TARGET_MINUTES: ${{ inputs.rto_target_minutes }}
        run: bun run restore:verify

      - name: Subir reportes sanitizados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restore-rehearsal-evidence
          path: |
            reports/restore-rehearsal.json
            reports/restore-rehearsal.md
          if-no-files-found: warn
          retention-days: 5


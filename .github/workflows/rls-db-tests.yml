name: RLS DB tests

# Fase 2 de supabase/tests/rls/README.md (TESTS-RLS-PHASE2).
# Levanta una base local vacía sin seed: start aplica el historial una vez.
# Verifica cada versión aplicada y corre todas las suites RLS y smoke SQL.
#
# Disparadores acotados (ver docs/ci.md): normalmente los cambios de funciones
# los valida deno-functions/CI. La excepción es el reconciliador REP y sus
# dependencias reales, que también requieren el nuevo gate PostgreSQL integrado.
# También disparan migraciones, SQL/RLS, config de Supabase, el carril Drizzle
# y los scripts que estas pruebas consumen.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/reconcile-stamping-invoices/**"
      - "supabase/functions/_shared/orgContext.ts"
      - "supabase/functions/_shared/storagePath.ts"
      - "supabase/functions/_shared/validate.ts"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "drizzle/migrations/**"
      - "scripts/run_sql_suites.py"
      - "scripts/ci_database.py"
      - "scripts/tests/**"
      - ".github/actions/setup-bun-project/**"
      - "drizzle.config.ts"
      - "drizzle.ci.config.ts"
      - "scripts/ci-drizzle-*.mjs"
      - "scripts/tests/ci-drizzle-*.test.mjs"
      - "bun.lock"
      - "package.json"
      - "scripts/patch_legacy_migrations.py"
      - "scripts/check-drizzle-journal.ts"
      - ".github/workflows/rls-db-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/reconcile-stamping-invoices/**"
      - "supabase/functions/_shared/orgContext.ts"
      - "supabase/functions/_shared/storagePath.ts"
      - "supabase/functions/_shared/validate.ts"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "drizzle/migrations/**"
      - "scripts/run_sql_suites.py"
      - "scripts/ci_database.py"
      - "scripts/tests/**"
      - ".github/actions/setup-bun-project/**"
      - "drizzle.config.ts"
      - "drizzle.ci.config.ts"
      - "scripts/ci-drizzle-*.mjs"
      - "scripts/tests/ci-drizzle-*.test.mjs"
      - "bun.lock"
      - "package.json"
      - "scripts/patch_legacy_migrations.py"
      - "scripts/check-drizzle-journal.ts"
      - ".github/workflows/rls-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rls-db-tests:
    name: RLS DB tests (Supabase local)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Mismo criterio que los jobs e2e/edge-functions de ci.yml: los PRs desde
    # forks no tienen acceso al entorno con secrets, y este job depende del
    # runner con Docker del repo. "Skipped" cuenta como success en el gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      # URL fija del Postgres que expone `supabase start` en local/CI.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v7

      - name: Probar ejecutor SQL antes de arrancar la BD
        run: python3 -m unittest discover -s scripts/tests -p test_run_sql_suites.py

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.34.0

      # Este job habla con la base SOLO por DB_URL/psql (y drizzle-kit): no usa
      # la API REST ni el gateway. Por eso se levanta únicamente Postgres + auth
      # (gotrue), sin gateway (kong) ni PostgREST, y sin el resto de servicios.
      #
      # IMPORTANTE: los nombres de `-x` deben existir en la CLI pineada. En
      # 2.34.0 los válidos son exactamente:
      #   edge-runtime, gotrue, imgproxy, kong, logflare, mailpit,
      #   postgres-meta, postgrest, realtime, storage-api, studio, supavisor, vector
      # `pgbouncer` ya no existe (se reemplazó por supavisor) y hacía que el
      # arranque no fuera el esperado. `gotrue` NO se excluye: las migraciones y
      # las suites RLS necesitan el schema `auth` (auth.users, auth.uid()).

      # Algunas migraciones históricas se escribieron contra producción, donde
      # la tabla referenciada ya existía por otro camino. Desde cero fallan con
      # 42P01 y tumban el job antes de correr un test. Este script envuelve esas
      # sentencias en un guard `to_regclass(...)` SOLO en el checkout del runner.
      - name: Parchar migraciones fuera de orden (solo en el runner)
        run: python3 scripts/patch_legacy_migrations.py

      - name: Exigir base vacía y deshabilitar seed local
        run: python3 scripts/ci_database.py prepare

      - name: Start Supabase (DB + auth, sin gateway ni PostgREST)
        continue-on-error: false
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          docker version
          supabase --version
          START_TS=$(date +%s)
          supabase start \
            -x studio,imgproxy,logflare,vector,edge-runtime,realtime,storage-api,mailpit,postgres-meta,supavisor,kong,postgrest
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "Start Supabase: ${ELAPSED}s (referencia run 35543605857: ~200s)"
          echo "### Start Supabase: ${ELAPSED}s (referencia previa ~200s)" >> "$GITHUB_STEP_SUMMARY"
          # `status` imprime URLs de servicios; con kong/postgrest excluidos puede
          # devolver salida parcial y no debe tumbar el job.
          supabase status || echo "supabase status parcial (servicios excluidos)"

      # Gate temprano: si el schema auth no quedó disponible, fallar tras el
      # arranque (las migraciones y las suites RLS dependen de auth.users y
      # auth.uid()). Así un arranque incompleto se distingue de una regresión SQL.
      - name: Verificar schema auth disponible
        run: |
          set -euo pipefail
          HAS_USERS=$(psql "$DB_URL" -Atc "select to_regclass('auth.users') is not null")
          HAS_UID=$(psql "$DB_URL" -Atc "select exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'auth' and p.proname = 'uid')")
          echo "auth.users: $HAS_USERS / auth.uid(): $HAS_UID"
          if [[ "$HAS_USERS" != "t" || "$HAS_UID" != "t" ]]; then
            echo "::error::El schema auth no está completo (auth.users=$HAS_USERS, auth.uid()=$HAS_UID)"
            exit 1
          fi


      # Diagnóstico para futuros fallos de arranque: sin esto el log del job
      # solo muestra "service not healthy" sin decir cuál ni por qué.
      - name: Diagnóstico de arranque (solo en fallo)
        if: failure()
        run: |
          set +e
          echo "::group::docker ps -a"
          docker ps -a
          echo "::endgroup::"
          echo "::group::supabase status"
          supabase status
          echo "::endgroup::"
          for c in $(docker ps -aq --filter "name=supabase_"); do
            echo "::group::logs $(docker inspect --format '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done



      # start ya aplicó el historial sobre el volumen nuevo. Comparamos las
      # versiones exactas; un reset adicional repetiría todo el arranque SQL.
      - name: Verificar migraciones aplicadas
        id: database-verified
        run: python3 scripts/ci_database.py verify

      # Drizzle debe aplicar desde su propio journal, no solo desde la lista
      # de archivos. Así el job valida que el mismo carril del rollout encuentra
      # y ejecuta cada migración después del historial Supabase.
      - name: Setup Bun project for Drizzle Kit
        uses: ./.github/actions/setup-bun-project

      - name: Validar journal de migraciones Drizzle
        run: bun run migrations:check

      - name: Probar guard y preparar replay Drizzle efímero
        run: |
          bun run test:ci-tools
          bun scripts/ci-drizzle-replay.mjs prepare
          mkdir -p reports
          cp .ci-drizzle-replay/manifest.json reports/ci-drizzle-replay-manifest.json

      - name: Aplicar y verificar migraciones Drizzle del replay efímero
        id: drizzle
        run: |
          set -euo pipefail
          bunx drizzle-kit migrate --config=drizzle.ci.config.ts
          bun scripts/ci-drizzle-replay.mjs verify

      - name: Diagnóstico PostgreSQL de Drizzle (sólo rollback en fallo)
        if: failure() && steps.drizzle.outcome == 'failure'
        run: bun scripts/ci-drizzle-diagnostics.mjs

      - name: Prepare reports directory
        run: mkdir -p reports

      # Separate fresh cluster, never the Supabase/shared database. Use only the
      # runner's preinstalled PostgreSQL and the repo's frozen postgres driver.
      - name: Recurring invoice locking regression (18 isolated scenarios)
        env:
          RUN_LOCAL_RECURRING_TESTS: "1"
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          for binary in initdb pg_ctl postgres; do
            test -x "$PG_BIN/$binary" || { echo "::error::Missing trusted PostgreSQL binary: $binary"; exit 1; }
          done
          "$PG_BIN/postgres" --version
          node scripts/tests/recurring-invoice-locking.test.cjs 2>&1 | tee reports/recurring-invoice-locking.log
          test "$(grep -c '^PASS ' reports/recurring-invoice-locking.log)" -eq 18 || {
            echo "::error::Expected all 18 recurring invoice locking scenarios; skip or partial runs are not accepted"
            exit 1
          }

      - name: REP recovery persistence (real isolated PostgreSQL, synthetic PAC)
        env:
          RUN_LOCAL_FISCAL_TESTS: "1"
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --noEmit -p scripts/tests/fiscal/tsconfig.json
          node scripts/tests/fiscal/run-rep-postgres.mjs 2>&1 | tee reports/rep-postgres-integration.log

      # Separate disposable cluster; no credentials or connection to shared data.
      # Replays the effective report source and verifies the new RPC's exact ACL.
      - name: Statement documents and inherited ACL regression (isolated PostgreSQL)
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          set -euo pipefail
          node scripts/tests/reports/income-statement-documents.cjs 2>&1 | tee reports/statement-documents.log

      # Focused fixture in a separately created disposable database. This tests
      # the exact sync migration and two real concurrent sessions; the full
      # product schema/RLS suites below remain a separate required check.
      - name: Non-recurring invoice overlap regression (isolated PostgreSQL)
        env:
          RUN_LOCAL_OVERLAP_TESTS: "1"
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 scripts/tests/test_nonrecurring_invoice_overlap.py 2>&1 | tee reports/nonrecurring-invoice-overlap.log

      - name: Protección del último raíz con dos sesiones concurrentes
        run: python3 scripts/platform_root_concurrency.py

      # Exercise the exceptional 0113 bootstrap before immutable 0111/0112
      # against two tenants, separately from the normal ascending replay above.
      - name: Global permission audit and atomic release (isolated PostgreSQL)
        env:
          RUN_LOCAL_SUMMARY_TESTS: "1"
          PGHOST: 127.0.0.1
          PGPORT: "54322"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_prepare_dispatcher_audit_release.py -v
          python3 scripts/tests/test_global_role_permission_audit.py -v 2>&1 | tee reports/global-permission-audit.log

      # Las suites RLS hacen SET LOCAL role / request.jwt.claims y terminan en
      # ROLLBACK (ver supabase/tests/rls/README.md). ON_ERROR_STOP=1: cualquier
      # RAISE EXCEPTION de una suite = fuga de RLS detectada.
      - name: RLS suites (supabase/tests/rls/*.sql)
        id: rls
        run: |
          python3 scripts/run_sql_suites.py \
            --db-url "$DB_URL" \
            --dir supabase/tests/rls \
            --junit reports/rls-db-junit.xml \
            --suite-name "RLS DB" \
            --mode strict

      # Los smoke verifican catálogo/estructura y reportan con
      # RAISE WARNING 'FALLO ...' en vez de abortar; `--mode smoke` convierte
      # ese FALLO en un caso rojo. Son BLOQUEANTES: las 42 suites pasan contra
      # una base recién creada desde las migraciones, así que un rojo aquí es
      # una regresión real, no datos ausentes.
      - name: Smoke SQL (supabase/tests/*.sql)
        id: smoke
        if: always() && steps.database-verified.outcome == 'success' && steps.drizzle.outcome == 'success'
        run: |
          python3 scripts/run_sql_suites.py \
            --db-url "$DB_URL" \
            --dir supabase/tests \
            --junit reports/sql-smoke-junit.xml \
            --suite-name "SQL smoke" \
            --mode smoke

      # Run after all existing rollback suites so these uniquely named,
      # committed concurrency fixtures cannot influence their assertions.
      # The job owns this fresh DB and always removes it in Stop Supabase.
      - name: Recurring invoice concurrency on full replayed schema (5 scenarios)
        run: |
          set -euo pipefail
          node scripts/tests/fiscal/recurring-full-schema.mjs 2>&1 | tee reports/recurring-full-schema.log
          test "$(grep -c '^PASS full-schema ' reports/recurring-full-schema.log)" -eq 5

      - name: Upload SQL reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rls-db-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish RLS DB results to PR summary
        if: always() && hashFiles('reports/rls-db-junit.xml') != ''
        uses: ./.github/actions/publish-test-results
        with:
          report_paths: reports/rls-db-junit.xml
          check_name: RLS DB results

      - name: Publish SQL smoke results to PR summary
        if: always() && hashFiles('reports/sql-smoke-junit.xml') != ''
        uses: ./.github/actions/publish-test-results
        with:
          report_paths: reports/sql-smoke-junit.xml
          check_name: SQL smoke results


      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

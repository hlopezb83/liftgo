name: RLS DB tests

# Fase 2 de supabase/tests/rls/README.md (TESTS-RLS-PHASE2).
# Levanta un Supabase local efímero, aplica las ~400 migraciones desde cero
# (esto valida además que apliquen limpio y en orden) y corre las 21 suites
# RLS SQL con roles/JWT reales, más los smoke SQL de supabase/tests/.
#
# Disparadores acotados (ver docs/ci.md): los cambios de supabase/functions/**
# no levantan Supabase completo —esos los valida deno-functions (deno fmt/lint,
# tests unitarios offline) y el CI principal (lint/typecheck/build/smoke).
# Aquí solo disparan migraciones, SQL/RLS, config de Supabase, el carril Drizzle
# y los scripts que estas pruebas consumen.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "drizzle/migrations/**"
      - "scripts/run_sql_suites.py"
      - "scripts/patch_legacy_migrations.py"
      - "scripts/check-drizzle-journal.ts"
      - ".github/workflows/rls-db-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - "drizzle/migrations/**"
      - "scripts/run_sql_suites.py"
      - "scripts/patch_legacy_migrations.py"
      - "scripts/check-drizzle-journal.ts"
      - ".github/workflows/rls-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-db-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rls-db-tests:
    name: RLS DB tests (Supabase local)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Mismo criterio que los jobs e2e/edge-functions de ci.yml: los PRs desde
    # forks no tienen acceso al entorno con secrets, y este job depende del
    # runner con Docker del repo. "Skipped" cuenta como success en el gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      checks: write
      pull-requests: write

    env:
      # URL fija del Postgres que expone `supabase start` en local/CI.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v7

      # Caché del binario de la CLI: setup-cli lo descarga de GitHub Releases
      # en cada run; la clave incluye la versión pineada para invalidar al subir.
      - name: Cache Supabase CLI
        uses: actions/cache@v6
        with:
          path: ~/.local/share/supabase-cli
          key: ${{ runner.os }}-supabase-cli-2.34.0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.34.0

      # Este job habla con la base SOLO por DB_URL/psql (y drizzle-kit): no usa
      # la API REST ni el gateway. Por eso se levanta únicamente Postgres + auth
      # (gotrue), sin gateway (kong) ni PostgREST, y sin el resto de servicios.
      #
      # IMPORTANTE: los nombres de `-x` deben existir en la CLI pineada. En
      # 2.34.0 los válidos son exactamente:
      #   edge-runtime, gotrue, imgproxy, kong, logflare, mailpit,
      #   postgres-meta, postgrest, realtime, storage-api, studio, supavisor, vector
      # `pgbouncer` ya no existe (se reemplazó por supavisor) y hacía que el
      # arranque no fuera el esperado. `gotrue` NO se excluye: las migraciones y
      # las suites RLS necesitan el schema `auth` (auth.users, auth.uid()).

      # Algunas migraciones históricas se escribieron contra producción, donde
      # la tabla referenciada ya existía por otro camino. Desde cero fallan con
      # 42P01 y tumban el job antes de correr un test. Este script envuelve esas
      # sentencias en un guard `to_regclass(...)` SOLO en el checkout del runner.
      - name: Parchar migraciones fuera de orden (solo en el runner)
        run: python3 scripts/patch_legacy_migrations.py

      - name: Start Supabase (DB + auth, sin gateway ni PostgREST)
        continue-on-error: false
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          docker version
          supabase --version
          START_TS=$(date +%s)
          supabase start \
            -x studio,imgproxy,logflare,vector,edge-runtime,realtime,storage-api,mailpit,postgres-meta,supavisor,kong,postgrest \
            --debug
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "Start Supabase: ${ELAPSED}s (referencia run 35543605857: ~200s)"
          echo "### Start Supabase: ${ELAPSED}s (referencia previa ~200s)" >> "$GITHUB_STEP_SUMMARY"
          # `status` imprime URLs de servicios; con kong/postgrest excluidos puede
          # devolver salida parcial y no debe tumbar el job.
          supabase status || echo "supabase status parcial (servicios excluidos)"

      # Gate temprano: si el schema auth no quedó disponible, fallar ANTES del
      # db reset (las migraciones y las suites RLS dependen de auth.users y
      # auth.uid()). Así un arranque incompleto se distingue de una regresión SQL.
      - name: Verificar schema auth disponible
        run: |
          set -euo pipefail
          HAS_USERS=$(psql "$DB_URL" -Atc "select to_regclass('auth.users') is not null")
          HAS_UID=$(psql "$DB_URL" -Atc "select exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'auth' and p.proname = 'uid')")
          echo "auth.users: $HAS_USERS / auth.uid(): $HAS_UID"
          if [[ "$HAS_USERS" != "t" || "$HAS_UID" != "t" ]]; then
            echo "::error::El schema auth no está completo (auth.users=$HAS_USERS, auth.uid()=$HAS_UID)"
            exit 1
          fi


      # Diagnóstico para futuros fallos de arranque: sin esto el log del job
      # solo muestra "service not healthy" sin decir cuál ni por qué.
      - name: Diagnóstico de arranque (solo en fallo)
        if: failure()
        run: |
          set +e
          echo "::group::docker ps -a"
          docker ps -a
          echo "::endgroup::"
          echo "::group::supabase status"
          supabase status
          echo "::endgroup::"
          for c in $(docker ps -aq --filter "name=supabase_"); do
            echo "::group::logs $(docker inspect --format '{{.Name}}' "$c")"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done



      # `db reset` re-crea la DB y reaplica TODAS las migraciones en orden:
      # si alguna migración no aplica limpio desde cero, el job falla aquí.
      - name: Reset DB (aplica todas las migraciones desde cero)
        run: supabase db reset --no-seed

      - name: Verificar migraciones aplicadas
        run: |
          set -euo pipefail
          APPLIED=$(psql "$DB_URL" -Atc "select count(*) from supabase_migrations.schema_migrations")
          FILES=$(find supabase/migrations -name '*.sql' | wc -l | tr -d ' ')
          echo "Migraciones aplicadas: $APPLIED / archivos: $FILES"
          if [[ "$APPLIED" -lt "$FILES" ]]; then
            echo "::error::Se aplicaron $APPLIED migraciones de $FILES archivos"
            exit 1
          fi

      # Drizzle debe aplicar desde su propio journal, no solo desde la lista
      # de archivos. Así el job valida que el mismo carril del rollout encuentra
      # y ejecuta cada migración después del historial Supabase.
      - name: Setup Bun project for Drizzle Kit
        uses: ./.github/actions/setup-bun-project

      - name: Validar journal de migraciones Drizzle
        run: bun run migrations:check

      - name: Aplicar migraciones Drizzle con drizzle-kit
        run: |
          set -euo pipefail
          export LOVABLE_DB_MIGRATION_URL="$DB_URL"
          bunx drizzle-kit migrate --config=drizzle.config.ts

      - name: Prepare reports directory
        run: mkdir -p reports

      # Las suites RLS hacen SET LOCAL role / request.jwt.claims y terminan en
      # ROLLBACK (ver supabase/tests/rls/README.md). ON_ERROR_STOP=1: cualquier
      # RAISE EXCEPTION de una suite = fuga de RLS detectada.
      - name: RLS suites (supabase/tests/rls/*.sql)
        id: rls
        run: |
          python3 scripts/run_sql_suites.py \
            --db-url "$DB_URL" \
            --dir supabase/tests/rls \
            --junit reports/rls-db-junit.xml \
            --suite-name "RLS DB" \
            --mode strict

      # Los smoke verifican catálogo/estructura y reportan con
      # RAISE WARNING 'FALLO ...' en vez de abortar; `--mode smoke` convierte
      # ese FALLO en un caso rojo. Son BLOQUEANTES: las 42 suites pasan contra
      # una base recién creada desde las migraciones, así que un rojo aquí es
      # una regresión real, no datos ausentes.
      - name: Smoke SQL (supabase/tests/*.sql)
        id: smoke
        if: always()
        run: |
          python3 scripts/run_sql_suites.py \
            --db-url "$DB_URL" \
            --dir supabase/tests \
            --junit reports/sql-smoke-junit.xml \
            --suite-name "SQL smoke" \
            --mode smoke

      - name: Upload SQL reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rls-db-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish RLS DB results to PR summary
        if: always() && hashFiles('reports/rls-db-junit.xml') != ''
        uses: ./.github/actions/publish-test-results
        with:
          report_paths: reports/rls-db-junit.xml
          check_name: RLS DB results

      - name: Publish SQL smoke results to PR summary
        if: always() && hashFiles('reports/sql-smoke-junit.xml') != ''
        uses: ./.github/actions/publish-test-results
        with:
          report_paths: reports/sql-smoke-junit.xml
          check_name: SQL smoke results


      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

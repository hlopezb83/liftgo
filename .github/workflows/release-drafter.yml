name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drafter-${{ github.workflow }}-${{ github.ref }}
  # Solo push:main y workflow_dispatch; nunca cancelamos porque cada run actualiza el draft acumulativo.
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: Actualizar draft de release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # v7.256.2: sin un release publicado, release-drafter resolvía 0.0.1 (parte
      # de 0.0.0 + patch). La versión canónica del proyecto vive en package.json
      # (sincronizada con public/changelog.json vía changelog-check.yml), así que
      # se la pasamos explícitamente: el input `version` tiene precedencia sobre
      # el cálculo por incremento.
      - name: Leer versión del proyecto
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versión del proyecto: ${VERSION}"

      - name: Release drafter
        # Pin a SHA (action de terceros). v7.6.0 (Node 24).
        uses: release-drafter/release-drafter@5a60cd8ddda6dc14fce77159675b8fd2cdca4007 # v7.6.0
        with:
          config-name: release-drafter.yml
          version: ${{ steps.pkg.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

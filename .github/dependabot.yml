version: 2
updates:
  # Aplicación y herramientas: ecosistema "bun".
  #
  # v7.297.2 — antes era "npm". Dependabot npm actualiza package.json pero NO
  # regenera `bun.lock`, así que `bun install --frozen-lockfile` (en
  # .github/actions/setup-bun-project) reventaba en TODOS los PRs de deps.
  # El ecosistema "bun" sí entiende el lockfile de texto `bun.lock`
  # (lockfileVersion 1) y lo regenera en el mismo commit del PR.
  #
  # Cadencia semanal, agrupada y con límites bajos para reducir revisiones
  # y corridas de CI. Las actualizaciones de seguridad se habilitan en GitHub
  # Settings y no esperan al calendario de actualizaciones de versión.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Monterrey"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # La primera regla coincidente gana. Las familias van antes del
      # mantenimiento para reunir paquetes de dependencies y devDependencies.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      tanstack-query:
        patterns:
          - "@tanstack/react-query"
          - "@tanstack/react-query-devtools"
          - "@tanstack/react-query-persist-client"
          - "@tanstack/query-sync-storage-persister"
        update-types: ["minor", "patch"]
      tanstack-router-start:
        patterns: ["@tanstack/react-router", "@tanstack/react-start", "@tanstack/start-storage-context"]
        update-types: ["minor", "patch"]
      sentry:
        patterns: ["@sentry/*"]
        update-types: ["minor", "patch"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
        update-types: ["minor", "patch"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
      # Clasificación por función: Vite y sus plugins también pueden estar
      # en dependencies. Al añadir herramientas, ampliar estos patrones.
      maintenance-tools:
        patterns:
          - "@babel/*"
          - "@eslint/*"
          - "@lovable.dev/*"
          - "@playwright/*"
          - "@rolldown/*"
          - "@testing-library/*"
          - "@types/*"
          - "@vitejs/*"
          - "babel-plugin-*"
          - "drizzle-*"
          - "eslint*"
          - "globals"
          - "happy-dom"
          - "jsdom"
          - "knip"
          - "nitro"
          - "postgres"
          - "prettier"
          - "rollup-plugin-*"
          - "typescript"
          - "typescript-eslint"
          - "vite*"
          - "wrangler"
        update-types: ["minor", "patch"]
      maintenance-frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # v7.302.4 — ignorar TypeScript 7.x hasta que typescript-eslint lo soporte.
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7"]

  # Funciones Cloud: versiones declaradas y usadas desde deno.json.
  # Los imports HTTPS siguen fuera de la cobertura de Dependabot Deno.
  - package-ecosystem: "deno"
    directory: "/supabase/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Monterrey"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      deno-maintenance:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Cloud declara compatibilidad con Deno 2.1.4; Sentry 11 exige >=2.8.3.
    # Reconsiderar tras verificar un runtime desplegado compatible.
    ignore:
      - dependency-name: "@sentry/deno"
        versions: [">= 11"]

  # GitHub Actions: un único PR agrupado por semana.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Monterrey"
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        update-types: ["minor", "patch"]

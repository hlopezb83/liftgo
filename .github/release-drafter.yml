name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# v7.247.2: migrado al esquema nuevo de release-drafter (PR #1558).
# - `exclude-labels` → categoría `type: pre-exclude`
# - `categories[*].labels` → `when.labels.any`
# - `version-resolver.major/minor.labels` → `semver-increment` por categoría
categories:
  - type: pre-exclude
    when:
      labels:
        any:
          - "skip-changelog"

  - title: "Nuevas funcionalidades"
    type: changelog
    semver-increment: minor
    when:
      labels:
        any:
          - "feature"
          - "enhancement"
  - title: "Fixes"
    type: changelog
    semver-increment: patch
    when:
      labels:
        any:
          - "fix"
          - "bug"
  - title: "Seguridad"
    type: changelog
    when:
      labels:
        any:
          - "security"
  - title: "Performance"
    type: changelog
    when:
      labels:
        any:
          - "performance"
  - title: "Infraestructura / CI"
    type: changelog
    semver-increment: patch
    when:
      labels:
        any:
          - "ci"
          - "infrastructure"
          - "dependencies"
  - title: "Base de datos"
    type: changelog
    when:
      labels:
        any:
          - "database"
  - title: "Documentación"
    type: changelog
    semver-increment: patch
    when:
      labels:
        any:
          - "docs"

  # Categorías sin título: sólo resuelven el incremento de versión, no salen en las notas.
  - type: version-resolver
    semver-increment: major
    when:
      labels:
        any:
          - "major"
          - "breaking"
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        any:
          - "minor"
  - type: version-resolver
    semver-increment: patch
    when:
      labels:
        any:
          - "patch"
          - "chore"

# v7.219.0 (M2): autolabeler por prefijo Conventional Commits del título del PR.
# El workflow pr-title.yml valida que el título respete estos prefijos.
autolabeler:
  - label: "feature"
    title:
      - "/^feat(\\(.+\\))?!?:/i"
  - label: "fix"
    title:
      - "/^fix(\\(.+\\))?!?:/i"
  - label: "performance"
    title:
      - "/^perf(\\(.+\\))?!?:/i"
  - label: "refactor"
    title:
      - "/^refactor(\\(.+\\))?!?:/i"
  - label: "docs"
    title:
      - "/^docs(\\(.+\\))?!?:/i"
  - label: "ci"
    title:
      - "/^ci(\\(.+\\))?!?:/i"
      - "/^build(\\(.+\\))?!?:/i"
  - label: "chore"
    title:
      - "/^chore(\\(.+\\))?!?:/i"
  - label: "breaking"
    title:
      - "/!:/"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  default: patch

template: |
  ## Cambios en esta versión

  $CHANGES

  **Changelog interno:** ver `public/changelog/v$RESOLVED_VERSION.json`.

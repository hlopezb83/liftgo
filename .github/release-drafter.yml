name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

# v7.247.4: esquema vigente de release-drafter (v7.6.0).
# - `exclude-labels` → categoría `type: pre-exclude`
# - `categories[*].labels` → `when.labels` (lista directa; el modo `any` es el default)
# - `version-resolver.major/minor.labels` → `semver-increment` por categoría
categories:
  - type: "pre-exclude"
    when:
      labels: ["skip-changelog"]

  - title: "Nuevas funcionalidades"
    semver-increment: "minor"
    when:
      labels: ["feature", "enhancement"]
  - title: "Fixes"
    semver-increment: "patch"
    when:
      labels: ["fix", "bug"]
  - title: "Seguridad"
    when:
      labels: ["security"]
  - title: "Performance"
    when:
      labels: ["performance"]
  - title: "Infraestructura / CI"
    semver-increment: "patch"
    when:
      labels: ["ci", "infrastructure", "dependencies"]
  - title: "Base de datos"
    when:
      labels: ["database"]
  - title: "Documentación"
    semver-increment: "patch"
    when:
      labels: ["docs"]

  # Categorías sin título: sólo resuelven el incremento de versión, no salen en las notas.
  - type: "version-resolver"
    semver-increment: "major"
    when:
      labels: ["major", "breaking"]
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      labels: ["minor"]
  - type: "version-resolver"
    semver-increment: "patch"
    when:
      labels: ["patch", "chore"]

# v7.219.0 (M2): autolabeler por prefijo Conventional Commits del título del PR.
# El workflow pr-title.yml valida que el título respete estos prefijos.
autolabeler:
  - label: "feature"
    title:
      - "/^feat(\\(.+\\))?!?:/i"
  - label: "fix"
    title:
      - "/^fix(\\(.+\\))?!?:/i"
  - label: "performance"
    title:
      - "/^perf(\\(.+\\))?!?:/i"
  - label: "refactor"
    title:
      - "/^refactor(\\(.+\\))?!?:/i"
  - label: "docs"
    title:
      - "/^docs(\\(.+\\))?!?:/i"
  - label: "ci"
    title:
      - "/^ci(\\(.+\\))?!?:/i"
      - "/^build(\\(.+\\))?!?:/i"
  - label: "chore"
    title:
      - "/^chore(\\(.+\\))?!?:/i"
  - label: "breaking"
    title:
      - "/!:/"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  default: patch

template: |
  ## Cambios en esta versión

  $CHANGES

  **Changelog interno:** ver `public/changelog/v$RESOLVED_VERSION.json`.
